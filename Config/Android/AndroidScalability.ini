; HAMPI BATTLEGROUND - Android scalability groups
; ------------------------------------------------------------
; @0 = LOW    (entry-level, 30 FPS target)
; @1 = MEDIUM (mainstream, 30-45 FPS target)
; @2 = HIGH   (capable devices, optional 60 FPS)
; @3 = fallback above HIGH; kept conservative for this project
;
; These values are selected by the sg.* cvars in DefaultDeviceProfiles.ini.
; This is a config-only change: no map, asset, or gameplay code is modified.

; ------------------------------------------------------------------------------
; Foliage / instanced vegetation density
; ------------------------------------------------------------------------------

[FoliageQuality@0]
foliage.DensityScale=0.500000
grass.DensityScale=0.500000
grass.CullDistanceScale=0.500000

[FoliageQuality@1]
foliage.DensityScale=0.800000
grass.DensityScale=0.800000
grass.CullDistanceScale=0.800000

[FoliageQuality@2]
foliage.DensityScale=1.000000
grass.DensityScale=1.000000
grass.CullDistanceScale=1.000000

[FoliageQuality@3]
foliage.DensityScale=1.000000
grass.DensityScale=1.000000
grass.CullDistanceScale=1.000000

; ------------------------------------------------------------------------------
; View distance
; ------------------------------------------------------------------------------

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.650000
r.NeverOcclusionTestDistance=1200

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.850000
r.NeverOcclusionTestDistance=1600

[ViewDistanceQuality@2]
r.ViewDistanceScale=1.000000
r.NeverOcclusionTestDistance=2000

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.000000
r.NeverOcclusionTestDistance=2000

; ------------------------------------------------------------------------------
; Shadows (project uses one directional light and no VSM)
; ------------------------------------------------------------------------------

[ShadowQuality@0]
r.ShadowQuality=0
r.Shadow.MaxCSMResolution=512
r.Shadow.DistanceScale=0.450000
r.Shadow.CSM.MaxCascades=1
r.Shadow.RadiusThreshold=0.080000
r.VolumetricFog=0
r.ContactShadows=0

[ShadowQuality@1]
r.ShadowQuality=1
r.Shadow.MaxCSMResolution=1024
r.Shadow.DistanceScale=0.700000
r.Shadow.CSM.MaxCascades=1
r.Shadow.RadiusThreshold=0.060000
r.VolumetricFog=0
r.ContactShadows=0

[ShadowQuality@2]
r.ShadowQuality=2
r.Shadow.MaxCSMResolution=2048
r.Shadow.DistanceScale=1.000000
r.Shadow.CSM.MaxCascades=2
r.Shadow.RadiusThreshold=0.060000
r.VolumetricFog=0
r.ContactShadows=0

[ShadowQuality@3]
r.ShadowQuality=2
r.Shadow.MaxCSMResolution=2048
r.Shadow.DistanceScale=1.000000
r.Shadow.CSM.MaxCascades=2
r.Shadow.RadiusThreshold=0.060000
r.VolumetricFog=0
r.ContactShadows=0

; ------------------------------------------------------------------------------
; Post process. Bloom/motion blur/lens flare are disabled in the project, so
; they stay disabled here; only tonemap and eye adaptation vary by tier.
; ------------------------------------------------------------------------------

[PostProcessQuality@0]
r.Tonemapper.Quality=1
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LightShaftQuality=0
r.EyeAdaptationQuality=1
r.Mobile.AmbientOcclusionQuality=0
r.Mobile.PixelProjectedReflectionQuality=0
r.LensFlareQuality=0

[PostProcessQuality@1]
r.Tonemapper.Quality=2
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LightShaftQuality=0
r.EyeAdaptationQuality=1
r.Mobile.AmbientOcclusionQuality=0
r.Mobile.PixelProjectedReflectionQuality=0
r.LensFlareQuality=0

[PostProcessQuality@2]
r.Tonemapper.Quality=2
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LightShaftQuality=0
r.EyeAdaptationQuality=1
r.Mobile.AmbientOcclusionQuality=0
r.Mobile.PixelProjectedReflectionQuality=0
r.LensFlareQuality=1

[PostProcessQuality@3]
r.Tonemapper.Quality=2
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.LightShaftQuality=0
r.EyeAdaptationQuality=1
r.Mobile.AmbientOcclusionQuality=0
r.Mobile.PixelProjectedReflectionQuality=0
r.LensFlareQuality=1

; ------------------------------------------------------------------------------
; Anti-aliasing. Main selection is r.Mobile.AntiAliasing in the device profile.
; ------------------------------------------------------------------------------

[AntiAliasingQuality@0]
r.FXAA.Quality=0

[AntiAliasingQuality@1]
r.FXAA.Quality=0

[AntiAliasingQuality@2]
r.FXAA.Quality=0

[AntiAliasingQuality@3]
r.FXAA.Quality=0

; ------------------------------------------------------------------------------
; Global illumination / reflections. Lumen and dynamic GI are off in this
; project; these keep those paths disabled on every Android tier.
; ------------------------------------------------------------------------------

[GlobalIlluminationQuality@0]
r.DistanceFieldAO=0
r.Lumen.DiffuseIndirect.Allow=0
r.SkyLight.RealTimeReflectionCapture=0

[GlobalIlluminationQuality@1]
r.DistanceFieldAO=0
r.Lumen.DiffuseIndirect.Allow=0
r.SkyLight.RealTimeReflectionCapture=0

[GlobalIlluminationQuality@2]
r.DistanceFieldAO=0
r.Lumen.DiffuseIndirect.Allow=0
r.SkyLight.RealTimeReflectionCapture=0

[GlobalIlluminationQuality@3]
r.DistanceFieldAO=0
r.Lumen.DiffuseIndirect.Allow=0
r.SkyLight.RealTimeReflectionCapture=0

[ReflectionQuality@0]
r.SSR.Quality=0
r.SSR.HalfResSceneColor=1
r.Lumen.Reflections.Allow=0

[ReflectionQuality@1]
r.SSR.Quality=0
r.SSR.HalfResSceneColor=1
r.Lumen.Reflections.Allow=0

[ReflectionQuality@2]
r.SSR.Quality=0
r.SSR.HalfResSceneColor=1
r.Lumen.Reflections.Allow=0

[ReflectionQuality@3]
r.SSR.Quality=0
r.SSR.HalfResSceneColor=1
r.Lumen.Reflections.Allow=0

; ------------------------------------------------------------------------------
; Effects / atmosphere. Values are taken from UE 5.4 Android scalability and
; kept conservative; no Niagara VFX are used by gameplay.
; ------------------------------------------------------------------------------

[EffectsQuality@0]
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=1
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=4
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=1.0
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=4.0
r.SkyAtmosphere.FastSkyLUT.Width=64
r.SkyAtmosphere.FastSkyLUT.Height=32
r.SkyAtmosphere.TransmittanceLUT.UseSmallFormat=1
r.RefractionQuality=0
fx.Niagara.QualityLevel=0

[EffectsQuality@1]
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=1
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=4
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=1.0
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=8.0
r.SkyAtmosphere.FastSkyLUT.Width=96
r.SkyAtmosphere.FastSkyLUT.Height=50
r.SkyAtmosphere.TransmittanceLUT.UseSmallFormat=1
r.RefractionQuality=0
fx.Niagara.QualityLevel=0

[EffectsQuality@2]
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=1
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=4
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=1.0
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=8.0
r.SkyAtmosphere.FastSkyLUT.Width=96
r.SkyAtmosphere.FastSkyLUT.Height=50
r.SkyAtmosphere.TransmittanceLUT.UseSmallFormat=1
r.RefractionQuality=0
fx.Niagara.QualityLevel=0

[EffectsQuality@3]
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=1
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=4
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=1.0
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=8.0
r.SkyAtmosphere.FastSkyLUT.Width=96
r.SkyAtmosphere.FastSkyLUT.Height=50
r.SkyAtmosphere.TransmittanceLUT.UseSmallFormat=1
r.RefractionQuality=1
fx.Niagara.QualityLevel=1

; ------------------------------------------------------------------------------
; Texture filtering. VT is off in this project.
; ------------------------------------------------------------------------------

[TextureQuality@0]
r.MaxAnisotropy=1

[TextureQuality@1]
r.MaxAnisotropy=1

[TextureQuality@2]
r.MaxAnisotropy=2

[TextureQuality@3]
r.MaxAnisotropy=4
